};

// ── Helpers ───────────────────────────────────────────────────────────────────
function toCad(a,c,s){ if(!a) return 0; const n=Number(a); return c==="CAD"?n:n*((s&&s.usdCad)||1.36); }
function fC(n){ if(!n&&n!==0) return "—"; return "C$"+Math.round(n).toLocaleString("en-CA"); }
function fA(n,c){ if(!n&&n!==0) return "—"; return (c==="USD"?"US$":"C$")+Math.round(Number(n)).toLocaleString("en-CA"); }
function fDate(iso){ if(!iso) return ""; return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function fPct(n){ if(!n&&n!==0) return "—"; return Number(n).toFixed(2)+"%"; }
function uid(){ return Date.now()+Math.floor(Math.random()*10000); }

function calcCarry(proceeds,capitalIn,closeDate,hp,cp){
  const wf=capitalIn*CLOSING_FEE;
  let yrs=1;
  if(closeDate){ yrs=Math.max((Date.now()-new Date(closeDate).getTime())/(365.25*24*3600*1000),1); }
  const hurdle=capitalIn*(hp/100)*yrs;
  if(proceeds<=capitalIn) return {workFee:0,workFeePayable:false,carryAmt:0,lpNet:proceeds,aboveHurdle:false,hurdle,yrs,totalItmvRev:0};
  const afterCap=proceeds-capitalIn;
  if(afterCap<wf) return {workFee:afterCap,workFeePayable:true,carryAmt:0,lpNet:capitalIn,aboveHurdle:false,hurdle,yrs,totalItmvRev:afterCap};
  const afterWF=afterCap-wf;
  if(afterWF<=hurdle) return {workFee:wf,workFeePayable:true,carryAmt:0,lpNet:proceeds-wf,aboveHurdle:false,hurdle,yrs,totalItmvRev:wf};
  const stepD=hurdle*(cp/100);
  const rem=afterWF-hurdle-stepD;
  const carryE=rem>0?rem*(cp/100):0;
  const carryAmt=stepD+carryE;
  return {workFee:wf,workFeePayable:true,carryAmt,lpNet:proceeds-wf-carryAmt,aboveHurdle:true,hurdle,yrs,totalItmvRev:wf+carryAmt};
}

// ── Supabase helpers ──────────────────────────────────────────────────────────
async function sbGet(table, key){
  const { data } = await db.from(table).select('value').eq('key', key).single();
  return data ? data.value : null;
}
async function sbSet(table, key, value){
  await db.from(table).upsert({ key, value }, { onConflict: 'key' });
}

function EditableField({label,value,onChange,type="text",options,placeholder}){
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState(value||"");
  useEffect(()=>{ setDraft(value||""); },[value]);
  const commit=()=>{ onChange(draft); setEditing(false); };
  const cancel=()=>{ setDraft(value||""); setEditing(false); };
  return(
    <div>
      {label&&<label style={lbl}>{label}</label>}
      {editing?(
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {options
            ?<select style={inp()} value={draft} onChange={e=>setDraft(e.target.value)} autoFocus>{options.map(o=><option key={o}>{o}</option>)}</select>
            :<input style={inp()} type={type} value={draft} onChange={e=>setDraft(e.target.value)} autoFocus onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape")cancel();}}/>}
          <div style={{display:"flex",gap:6}}>
            <button onClick={commit} style={btn("primary",{padding:"4px 12px",fontSize:"11px"})}>Save</button>
            <button onClick={cancel} style={btn("ghost",{padding:"4px 10px",fontSize:"11px"})}>Cancel</button>
          </div>
        </div>
      ):(
        <div onClick={()=>setEditing(true)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",background:"#f3f4f6",borderRadius:8,fontSize:"13px",color:value?"#111":"#9ca3af",fontStyle:value?"normal":"italic",border:"1px solid #e5e7eb",cursor:"pointer",fontFamily:F,minHeight:36}} title="Click to edit">
          <span style={{flex:1}}>{value||(placeholder||"Not set")}</span><EditIcon/>
        </div>
      )}
    </div>
  );
}

function AutocompleteInput({value,onChange,options,placeholder}){
  const [open,setOpen]=useState(false);
  const filtered=value&&value.trim().length>0
    ?options.filter(o=>o&&o.toLowerCase().includes(value.toLowerCase())&&o.toLowerCase()!==value.toLowerCase()).filter((v,i,a)=>a.indexOf(v)===i)
    :[];
  return(
    <div style={{position:"relative"}}>
      <input style={inp()} value={value} onChange={e=>{onChange(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)} placeholder={placeholder||""}/>

        <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #e5e7eb",borderRadius:8,boxShadow:"0 4px 12px rgba(0,0,0,0.08)",zIndex:60,overflow:"hidden",marginTop:2}}>

              onMouseEnter={e=>e.currentTarget.style.background="#f9f9f7"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>{o}</div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── DataRoomFiles ─────────────────────────────────────────────────────────────
function DataRoomFiles({dealId, settings}){
  const [files,setFiles]=useState([]);
  const [uploading,setUploading]=useState(false);
  const fileRef=useRef(null);

  useEffect(()=>{
    sbGet('dataroom', `deal-${dealId}`).then(v=>{ if(v) setFiles(v); });
  },[dealId]);

  async function saveF(f){ await sbSet('dataroom', `deal-${dealId}`, f); }

  function upload(e){
    setUploading(true);
    const pending=Array.from(e.target.files);
    let done=0;
    pending.forEach(f=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const id=uid();
        setFiles(prev=>{
          const u=prev.concat([{id,name:f.name,size:f.size,uploaded:new Date().toISOString(),dataUrl:ev.target.result}]);
          saveF(u);
          done++;
          if(done===pending.length) setUploading(false);
          return u;
        });
      };
      reader.readAsDataURL(f);
    });
  }

  function remove(id){ const u=files.filter(f=>f.id!==id); setFiles(u); saveF(u); }
  function download(f){ if(!f.dataUrl) return; const a=document.createElement("a"); a.href=f.dataUrl; a.download=f.name; a.click(); }
  function fmtSize(b){ return b>1048576?(b/1048576).toFixed(1)+"MB":b>1024?Math.round(b/1024)+"KB":b+"B"; }

  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:6}}>
        <button onClick={()=>fileRef.current.click()} style={btn("ghost",{padding:"4px 10px",fontSize:"11px"})}>{uploading?"Uploading…":"+ Upload"}</button>
        <input ref={fileRef} type="file" multiple style={{display:"none"}} onChange={upload}/>
      </div>
      {files.length===0&&<div style={{padding:"10px 12px",background:"#f9f9f7",borderRadius:8,fontSize:"12px",color:"#9ca3af",fontFamily:F,border:"1px dashed #e5e7eb",textAlign:"center"}}>No documents uploaded</div>}
      {files.map(f=>(
        <div key={f.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:"#f9f9f7",borderRadius:8,marginBottom:4}}>
          <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
            <div style={{width:24,height:24,background:"#e5e7eb",borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:"8px",fontWeight:700,color:"#374151",fontFamily:F}}>{f.name.split(".").pop().toUpperCase().slice(0,4)}</span></div>
            <div style={{minWidth:0}}>
              <div style={{fontSize:"12px",fontWeight:600,color:"#111",fontFamily:F,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{f.name}</div>
              {f.size&&<div style={{fontSize:"10px",color:"#9ca3af",fontFamily:F}}>{fmtSize(f.size)}</div>}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0,marginLeft:8}}>
            {f.dataUrl&&<button onClick={()=>download(f)} style={{background:"none",border:"none",cursor:"pointer",color:"#2563eb",fontSize:"11px",fontFamily:F,textDecoration:"underline",padding:0}}>Download</button>}
            <button onClick={()=>remove(f.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#9ca3af",fontSize:16,lineHeight:1,padding:0}}>×</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function ExitCalculator({deal,savedScenarios,onSaveScenarios,settings}){
  const init=savedScenarios&&savedScenarios.length>0?savedScenarios:[{label:"Base Case",exitVal:""},{label:"Bull Case",exitVal:""},{label:"Bear Case",exitVal:""}];
  const [scenarios,setScenarios]=useState(init);
  const cd=deal.completionData||{};
  const totalIn=cd.totalCad||0;
  const closeDate=cd.closeDate||null;
  const ownership=(cd.ownership||0)/100;
  const hp=settings.hurdlePct!=null?settings.hurdlePct:5;
  const cp=settings.carryPct!=null?settings.carryPct:20;

  useEffect(()=>{ onSaveScenarios(scenarios); },[JSON.stringify(scenarios)]);
  const upd=(i,k,v)=>setScenarios(prev=>prev.map((s,idx)=>idx===i?{...s,[k]:v}:s));

  return(
    <div style={{background:"#f9f9f7",borderRadius:10,padding:"14px 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:"10px",fontWeight:800,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.08em",fontFamily:F}}>Exit Analysis</div>
        <button onClick={()=>setScenarios(p=>[...p,{label:"",exitVal:""}])} style={btn("ghost",{padding:"3px 10px",fontSize:"11px"})}>+ Add Scenario</button>
      </div>
      {!ownership&&<div style={{fontSize:"11px",color:"#92400e",background:"#fffbeb",padding:"6px 10px",borderRadius:6,marginBottom:10,fontFamily:F}}>Set ownership % in completion details to enable calculations.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {scenarios.map((sc,i)=>{
          const ev=Number(sc.exitVal)||0;
          const proceeds=ev*ownership;
          const res=calcCarry(proceeds,totalIn,closeDate,hp,cp);
          const moic=totalIn>0&&proceeds>0?(proceeds/totalIn).toFixed(2):null;
          const hasData=ev>0&&ownership>0&&totalIn>0;
          return(
            <div key={i} style={{background:"#fff",borderRadius:8,border:"1px solid #e5e7eb",overflow:"hidden"}}>
              <div style={{display:"flex",gap:8,alignItems:"center",padding:"10px 12px",borderBottom:hasData?"1px solid #f0f0f0":"none"}}>
                <input style={inp({flex:"0 0 150px",fontSize:"12px",fontWeight:600,background:"#f9f9f7",padding:"5px 9px"})} value={sc.label} onChange={e=>upd(i,"label",e.target.value)} placeholder={`Scenario ${i+1}`}/>
                <span style={{fontSize:"11px",color:"#9ca3af",fontFamily:F,whiteSpace:"nowrap"}}>Exit val (C$)</span>
                <input style={inp({flex:1,fontSize:"12px",padding:"5px 9px"})} type="number" value={sc.exitVal} onChange={e=>upd(i,"exitVal",e.target.value)} placeholder="0"/>
                {scenarios.length>1&&<button onClick={()=>setScenarios(p=>p.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",cursor:"pointer",color:"#d1d5db",fontSize:16,padding:0,flexShrink:0}}>×</button>}
              </div>
              {hasData&&(
                <div style={{padding:"10px 12px"}}>
                  <div style={{fontSize:"10px",color:"#9ca3af",marginBottom:8,fontFamily:F}}>{`Hurdle: ${hp}% p.a. × ${res.yrs.toFixed(1)} yrs = ${fC(res.hurdle)} | Ownership: ${fPct(ownership*100)}`}</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:8}}>
                    {[{l:"ITMV Proceeds",v:fC(proceeds)},{l:"Work Fee (2%)",v:res.workFeePayable?fC(res.workFee):"Not payable",c:res.workFeePayable?"#065f46":"#9ca3af"},{l:`Carry (${cp}%)`,v:res.aboveHurdle?fC(res.carryAmt):"Below hurdle",c:res.aboveHurdle?"#065f46":"#9ca3af"},{l:"Total ITMV Rev",v:fC(res.totalItmvRev),c:"#065f46",bold:true},{l:"LP Net",v:fC(res.lpNet)}].map(f=>(
                      <div key={f.l} style={{background:"#f9f9f7",borderRadius:6,padding:"7px 9px"}}><div style={{fontSize:"9px",fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:2,fontFamily:F}}>{f.l}</div><div style={{fontSize:"12px",fontWeight:f.bold?700:600,color:f.c||"#111",fontFamily:MONO}}>{f.v}</div></div>
                    ))}
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <div style={{background:Number(moic)>=2?"#f0fdf4":Number(moic)>=1?"#f3f4f6":"#fef2f2",borderRadius:6,padding:"5px 10px",display:"inline-flex",gap:6,alignItems:"center"}}>
                      <span style={{fontSize:"10px",fontWeight:700,color:"#6b7280",textTransform:"uppercase",fontFamily:F}}>MOIC</span>
                      <span style={{fontSize:"14px",fontWeight:700,color:Number(moic)>=2?"#065f46":Number(moic)>=1?"#374151":"#ef4444",fontFamily:MONO}}>{moic?`${moic}x`:"—"}</span>
                    </div>
                    <div style={{background:res.aboveHurdle?"#f0fdf4":"#fffbeb",borderRadius:6,padding:"5px 10px",display:"inline-flex",gap:6,alignItems:"center"}}>
                      <span style={{fontSize:"10px",fontWeight:700,color:"#6b7280",textTransform:"uppercase",fontFamily:F}}>Hurdle</span>
                      <span style={{fontSize:"12px",fontWeight:700,color:res.aboveHurdle?"#065f46":"#92400e",fontFamily:F}}>{res.aboveHurdle?"Cleared":"Not cleared"}</span>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Completion Modal ──────────────────────────────────────────────────────────
function CompletionModal({deal,onConfirm,onCancel,settings}){
  const DRAFT_KEY=`itmv-cdraft-${deal.id}`;
  const [loaded,setLoaded]=useState(false);
  const [postMoney,setPostMoney]=useState("");
  const [totalRound,setTotalRound]=useState("");
  const [ownership,setOwnership]=useState("");
  const [closeDate,setCloseDate]=useState(new Date().toISOString().split("T")[0]);
  const [err,setErr]=useState("");

  useEffect(()=>{
    try{
      const saved=localStorage.getItem(DRAFT_KEY);
      if(saved){ const d=JSON.parse(saved); setPostMoney(d.postMoney||""); setTotalRound(d.totalRound||""); setOwnership(d.ownership||""); setCloseDate(d.closeDate||new Date().toISOString().split("T")[0]); }
      else if(deal.completionData){ const cd=deal.completionData; setPostMoney(cd.postMoney?String(cd.postMoney):""); setTotalRound(cd.totalRound?String(cd.totalRound):""); setOwnership(cd.ownership?String(cd.ownership):""); setCloseDate(cd.closeDate||new Date().toISOString().split("T")[0]); }
    }catch(e){}
    setLoaded(true);
  },[]);

  const saveDraft=(pm,tr,ow,cd)=>{ try{ localStorage.setItem(DRAFT_KEY,JSON.stringify({postMoney:pm,totalRound:tr,ownership:ow,closeDate:cd})); }catch(e){} };
  const totalCad=deal.investors.reduce((s,i)=>s+toCad(i.amount,i.currency,settings),0);
  const hp=settings.hurdlePct!=null?settings.hurdlePct:5;
  const hurdle=totalCad*(hp/100);
  const suggested=postMoney&&totalCad?((totalCad/Number(postMoney))*100).toFixed(2):null;

  function confirm(){
    if(!ownership||Number(ownership)<=0){ setErr("ITMV Ownership % is required."); return; }
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    onConfirm({postMoney:Number(postMoney)||0,totalRound:Number(totalRound)||0,ownership:Number(ownership),totalCad,closeDate});
  }

  if(!loaded) return null;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}}>
      <div style={{background:"#fff",borderRadius:14,padding:"28px 30px",width:"100%",maxWidth:520,fontFamily:F,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 32px 80px rgba(0,0,0,0.25)"}}>
        <h2 style={{margin:"0 0 20px",fontSize:"17px",fontWeight:700,color:"#111",fontFamily:F}}>Complete deal — {deal.name}</h2>
        <div style={{background:"#f9f9f7",borderRadius:10,padding:"12px 14px",marginBottom:18}}>
          <div style={{fontSize:"10px",fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:8,fontFamily:F}}>Investor summary</div>
          {deal.investors.length===0&&<div style={{fontSize:"12px",color:"#9ca3af",fontFamily:F}}>No investors added yet.</div>}
          {deal.investors.map(i=>{ const cad=toCad(i.amount,i.currency,settings); return <div key={i.id} style={{display:"flex",justifyContent:"space-between",fontSize:"12px",color:"#374151",padding:"3px 0",borderBottom:"1px solid #f0f0f0",fontFamily:F}}><span style={{fontWeight:600}}>{i.name||"Unnamed"}</span><span style={{fontFamily:MONO}}>{fA(i.amount,i.currency)} ({fC(cad)})</span></div>; })}
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",fontWeight:700,paddingTop:8,marginTop:4,fontFamily:F}}><span style={{color:"#111"}}>Total</span><span style={{fontFamily:MONO}}>{fC(totalCad)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",fontWeight:700,fontFamily:F}}><span style={{color:"#065f46"}}>Work fee (2%)</span><span style={{color:"#065f46",fontFamily:MONO}}>{fC(totalCad*CLOSING_FEE)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",color:"#6b7280",paddingTop:4,marginTop:4,borderTop:"1px solid #f0f0f0",fontFamily:F}}><span>Investor hurdle ({hp}% p.a.)</span><span style={{fontWeight:600,fontFamily:MONO}}>{fC(hurdle)}</span></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div><label style={lbl}>Post-money valuation (C$)</label><input style={inp()} type="number" value={postMoney} onChange={e=>{const v=e.target.value;setPostMoney(v);saveDraft(v,totalRound,ownership,closeDate);}} placeholder="Optional"/></div>
          <div><label style={lbl}>Total round size (C$)</label><input style={inp()} type="number" value={totalRound} onChange={e=>{const v=e.target.value;setTotalRound(v);saveDraft(postMoney,v,ownership,closeDate);}} placeholder="Optional"/></div>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
            <label style={lbl}>ITMV Ownership % *</label>
            {suggested&&<button onClick={()=>{setOwnership(suggested);saveDraft(postMoney,totalRound,suggested,closeDate);}} style={{background:"none",border:"none",fontSize:"10px",color:"#2563eb",cursor:"pointer",fontFamily:F}}>Use suggested: {suggested}%</button>}
          </div>
          <input style={inp()} type="number" step="0.01" value={ownership} onChange={e=>{const v=e.target.value;setOwnership(v);saveDraft(postMoney,totalRound,v,closeDate);}} placeholder="e.g. 2.50"/>
        </div>
        <div style={{marginBottom:20}}><label style={lbl}>Close date</label><input style={inp()} type="date" value={closeDate} onChange={e=>{const v=e.target.value;setCloseDate(v);saveDraft(postMoney,totalRound,ownership,v);}}/></div>
        {err&&<div style={{fontSize:"12px",color:"#ef4444",marginBottom:12,fontFamily:F}}>{err}</div>}
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick={onCancel} style={btn("ghost")}>Save & close</button>
          <button onClick={confirm} style={btn("green",{padding:"9px 20px",fontSize:"13px"})}>Confirm & close deal</button>
        </div>
      </div>
    </div>
  );
}

        <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",paddingTop:4,marginTop:4,borderTop:"1px solid #f0f0f0",fontFamily:F}}><span style={{color:"#6b7280"}}>Investor hurdle ({hp}% p.a.)</span><strong style={{fontFamily:MONO}}>{fC(totalCad*(hp/100))}</strong></div>

}

// ── Deal Modal ────────────────────────────────────────────────────────────────
function DealModal({deal,onSave,onClose,onDelete,onPass,onComplete,settings,invProfiles,setInvProfiles,deals,scenarios,onSaveScenarios}){
  const liveDeal=deal.id?deals.find(x=>x.id===deal.id)||deal:deal;

  const [notes,setNotes]=useState(liveDeal.threadNotes||[]);
  const [newNote,setNewNote]=useState("");
  const [newNoteTag,setNewNoteTag]=useState("General");
  const [noteDate,setNoteDate]=useState("");
  const [noteDateEnabled,setNoteDateEnabled]=useState(false);
  const [author,setAuthor]=useState(()=>{ try{return localStorage.getItem("itmv-author")||"";}catch(e){return "";} });
  const [newCoInv,setNewCoInv]=useState("");
  const [autoSaveMsg,setAutoSaveMsg]=useState("");
  const notesEnd=useRef(null);
  const isCompleted=form.stage==="Completed";

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  function setAndAutoSave(k,v){
    const updated={...form,[k]:v}; setForm(updated);
    if(isCompleted){ onSave({...updated,threadNotes:notes},false); setAutoSaveMsg("Saved"); setTimeout(()=>setAutoSaveMsg(""),2000); }
  }
  function handleUpdateCompletion(cd){
    const updated={...form,completionData:cd}; setForm(updated);
    onSave({...updated,threadNotes:notes},false); setAutoSaveMsg("Saved"); setTimeout(()=>setAutoSaveMsg(""),2000);
  }

  function addInv(){ set("investors",[...form.investors,{id:uid(),name:"",email:"",amount:"",currency:settings.defaultCurrency||"USD",affiliateEntity:""}]); }
  function updInv(id,k,v){
    const updated=form.investors.map(i=>i.id===id?{...i,[k]:v}:i); set("investors",updated);
    const inv=updated.find(i=>i.id===id);
    if(inv&&inv.name){ setInvProfiles(prev=>{ const key=inv.name.toLowerCase(); return {...prev,[key]:{name:inv.name,email:inv.email||(prev[key]?.email||""),currency:inv.currency||(prev[key]?.currency||"USD"),affiliateEntity:inv.affiliateEntity||(prev[key]?.affiliateEntity||"")}}; }); }
  }
  function handleInvName(id,val,mode,profile){
    if(mode==="autofill"&&profile){ set("investors",form.investors.map(i=>i.id===id?{...i,name:profile.name,email:i.email||profile.email||"",currency:i.currency||profile.currency||"USD",affiliateEntity:i.affiliateEntity||profile.affiliateEntity||""}:i)); }
    else updInv(id,"name",val);
  }
  function delInv(id){ set("investors",form.investors.filter(i=>i.id!==id)); }

    onSave({...form,threadNotes:u},false);
    setTimeout(()=>{ if(notesEnd.current) notesEnd.current.scrollIntoView({behavior:"smooth"}); },100);
  }

  function handleSave(){ onSave({...form,threadNotes:notes},true); }
  const totalCad=form.investors.reduce((s,i)=>s+toCad(i.amount,i.currency,settings),0);
  const SH=label=><div style={{fontSize:"10px",fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10,fontFamily:F}}>{label}</div>;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
      <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:940,boxShadow:"0 24px 64px rgba(0,0,0,0.15)",fontFamily:F,maxHeight:"94vh",display:"flex",flexDirection:"column"}}>

              <span style={{fontSize:"17px",fontWeight:700,color:"#111",fontFamily:F}}>{form.name||"New deal"}</span>

                <div>
                  <label style={lbl}>Investment type</label>
                  {isCompleted?<EditableField value={form.investType} onChange={v=>setAndAutoSave("investType",v)} options={INVEST_TYPES}/>:<select style={inp()} value={form.investType} onChange={e=>set("investType",e.target.value)}>{INVEST_TYPES.map(t=><option key={t}>{t}</option>)}</select>}
                  {form.investType==="Other"&&(isCompleted?<EditableField value={form.investTypeOther||""} onChange={v=>setAndAutoSave("investTypeOther",v)} placeholder="Specify..."/>:<input style={inp({marginTop:6})} value={form.investTypeOther||""} onChange={e=>set("investTypeOther",e.target.value)} placeholder="Specify..."/>)}
                </div>
                <div>
                  <label style={lbl}>Headquartered</label>
                  {isCompleted?<EditableField value={form.hq||"Canada"} onChange={v=>setAndAutoSave("hq",v)} options={HQ_OPTIONS}/>:<select style={inp()} value={form.hq||"Canada"} onChange={e=>set("hq",e.target.value)}>{HQ_OPTIONS.map(h=><option key={h}>{h}</option>)}</select>}
                  {form.hq==="Other"&&(isCompleted?<EditableField value={form.hqOther||""} onChange={v=>setAndAutoSave("hqOther",v)} placeholder="Specify..."/>:<input style={inp({marginTop:6})} value={form.hqOther||""} onChange={e=>set("hqOther",e.target.value)} placeholder="Specify..."/>)}
                </div>
              </div>
              <div style={{background:"#fafaf8",borderRadius:10,padding:"14px 16px"}}>
                {SH("Company Contact")}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
                  <div><label style={lbl}>Contact name</label>{isCompleted?<EditableField value={form.contactName||""} onChange={v=>setAndAutoSave("contactName",v)} placeholder="Not set"/>:<input style={inp()} value={form.contactName||""} onChange={e=>set("contactName",e.target.value)} placeholder="Full name"/>}</div>
                  <div><label style={lbl}>Role</label>{isCompleted?<EditableField value={form.contactRole||""} onChange={v=>setAndAutoSave("contactRole",v)} options={CONTACT_ROLES}/>:<select style={inp()} value={form.contactRole||"Founder"} onChange={e=>set("contactRole",e.target.value)}>{CONTACT_ROLES.map(r=><option key={r}>{r}</option>)}</select>}</div>
                  {!isCompleted&&<div>
                    <label style={lbl}>Meeting?</label>
                    <div style={{display:"flex",gap:5}}>{MEETING_STATUS.map(s=><button key={s} onClick={()=>{set("managementMeeting",s);if(s==="Yes"){setTab("notes");setNewNoteTag("Meeting");}}} style={{padding:"4px 10px",borderRadius:20,border:form.managementMeeting===s?"1.5px solid #111":"1.5px solid #e5e7eb",background:form.managementMeeting===s?"#111":"#fff",color:form.managementMeeting===s?"#fff":"#374151",fontSize:"12px",fontWeight:600,cursor:"pointer",fontFamily:F}}>{s}</button>)}</div>
                    {form.managementMeeting==="Scheduled"&&<input style={inp({marginTop:6})} type="date" value={form.meetingDate||""} onChange={e=>set("meetingDate",e.target.value)}/>}
                  </div>}
                </div>
              </div>
              <div style={{background:"#fafaf8",borderRadius:10,padding:"14px 16px"}}>
                {SH("Deal Attribution")}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
                  <div><label style={lbl}>ITMV referral</label>{isCompleted?<EditableField value={form.itmvReferral||""} onChange={v=>setAndAutoSave("itmvReferral",v)} options={[""].concat(ITMV_REFERRALS)} placeholder="Not set"/>:<><select style={inp()} value={form.itmvReferral||""} onChange={e=>set("itmvReferral",e.target.value)}><option value="">Select...</option>{ITMV_REFERRALS.map(r=><option key={r}>{r}</option>)}</select>{form.itmvReferral==="Other"&&<input style={inp({marginTop:6})} value={form.itmvReferralOther||""} onChange={e=>set("itmvReferralOther",e.target.value)}/>}</>}</div>
                  <div><label style={lbl}>External referral</label>{isCompleted?<EditableField value={form.externalReferral||""} onChange={v=>setAndAutoSave("externalReferral",v)} placeholder="Not set"/>:<AutocompleteInput value={form.externalReferral||""} onChange={v=>set("externalReferral",v)} options={deals.map(d=>d.externalReferral).filter(Boolean)} placeholder="Name or firm..."/>}</div>
                  <div><label style={lbl}>Relationship source</label>{isCompleted?<EditableField value={form.relationshipSource||""} onChange={v=>setAndAutoSave("relationshipSource",v)} placeholder="Not set"/>:<AutocompleteInput value={form.relationshipSource||""} onChange={v=>set("relationshipSource",v)} options={deals.map(d=>d.relationshipSource).filter(Boolean)} placeholder="How relationship was established..."/>}</div>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div><label style={lbl}>Website</label>{isCompleted?<EditableField value={form.website||""} onChange={v=>setAndAutoSave("website",v)} placeholder="Not set"/>:form.website?<div style={{display:"flex",alignItems:"center",gap:8}}><a href={`https://${form.website.replace(/^https?:\/\//,"")}`} target="_blank" rel="noopener noreferrer" style={{fontSize:"13px",color:"#2563eb",textDecoration:"none",fontFamily:F}}>{form.website} ↗</a><button onClick={()=>set("website","")} style={{background:"none",border:"none",fontSize:"11px",color:"#9ca3af",cursor:"pointer",textDecoration:"underline",fontFamily:F}}>Change</button></div>:<input style={inp()} value={form.website||""} onChange={e=>set("website",e.target.value)}/>}</div>
              </div>
              {isCompleted&&form.id&&<div style={{background:"#fafaf8",borderRadius:10,padding:"14px 16px"}}>{SH("Data Room")}<DataRoomFiles dealId={form.id} settings={settings}/></div>}
              {isCompleted&&form.completionData&&<ExitCalculator deal={form} savedScenarios={scenarios} onSaveScenarios={s=>onSaveScenarios(form.id,s)} settings={settings}/>}
            </div>
          )}

          {tab==="investors"&&(
            <div>
              {isCompleted?(
                <div>
                  {form.investors.map(inv=>{
                    const cad=toCad(inv.amount,inv.currency,settings);
                    const sv=(field,val)=>{ const updated=form.investors.map(i=>i.id===inv.id?{...i,[field]:val}:i); const u={...form,investors:updated}; setForm(u); onSave(u,false); };
                    return(
                      <div key={inv.id} style={{background:"#f9f9f7",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 110px 80px",gap:8,marginBottom:8}}>
                          <EditableField label="Name" value={inv.name} onChange={v=>sv("name",v)} placeholder="Not set"/>
                          <EditableField label="Email" value={inv.email||""} onChange={v=>sv("email",v)} placeholder="Not set"/>
                          <EditableField label="Amount" value={inv.amount?String(inv.amount):""} onChange={v=>sv("amount",v)} type="number"/>
                          <EditableField label="Currency" value={inv.currency} onChange={v=>sv("currency",v)} options={CURRENCIES}/>
                        </div>
                        <EditableField label="Affiliate entity" value={inv.affiliateEntity||""} onChange={v=>sv("affiliateEntity",v)} placeholder="Not set"/>
                        {cad>0&&<div style={{fontSize:"11px",color:"#6b7280",paddingTop:6,borderTop:"1px solid #f0f0f0",marginTop:8,fontFamily:F}}>{fC(cad)} · Work fee: {fC(cad*CLOSING_FEE)}</div>}
                      </div>
                    );
                  })}
                </div>
              ):(
                <div>
                  <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}><button onClick={addInv} style={btn("primary",{padding:"6px 12px"})}>+ Add investor</button></div>
                  {form.investors.length===0&&<div style={{textAlign:"center",padding:32,color:"#9ca3af",fontSize:"13px",fontFamily:F}}>No investors added yet.</div>}
                  {form.investors.map(inv=>{
                    const cad=toCad(inv.amount,inv.currency,settings);
                    return(
                      <div key={inv.id} style={{background:"#f9f9f7",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 110px 80px 32px",gap:8,alignItems:"end",marginBottom:8}}>
                          <div><label style={lbl}>Name</label><InvNameInput value={inv.name} onChange={(v,m,p)=>handleInvName(inv.id,v,m,p)} profiles={invProfiles}/></div>
                          <div><label style={lbl}>Email</label><input style={inp()} type="email" value={inv.email||""} onChange={e=>updInv(inv.id,"email",e.target.value)}/></div>
                          <div><label style={lbl}>Amount</label><input style={inp()} type="number" value={inv.amount} onChange={e=>updInv(inv.id,"amount",e.target.value)}/></div>
                          <div><label style={lbl}>Currency</label><select style={inp()} value={inv.currency} onChange={e=>updInv(inv.id,"currency",e.target.value)}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select></div>
                          <button onClick={()=>delInv(inv.id)} style={btn("danger",{padding:"7px 8px",height:34,alignSelf:"flex-end"})}>×</button>
                        </div>
                        <div><label style={lbl}>Affiliate entity</label><input style={inp()} value={inv.affiliateEntity||""} onChange={e=>updInv(inv.id,"affiliateEntity",e.target.value)} placeholder="Legal entity or leave blank"/></div>
                        {cad>0&&<div style={{fontSize:"11px",color:"#6b7280",paddingTop:6,borderTop:"1px solid #f0f0f0",marginTop:8,fontFamily:F}}>{fC(cad)} · Work fee: {fC(cad*CLOSING_FEE)}</div>}
                      </div>
                    );
                  })}
                  {form.investors.length>0&&<div style={{background:"#f0fdf4",borderRadius:10,padding:"11px 14px",marginTop:6}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:3,fontFamily:F}}><span style={{color:"#374151"}}>Total</span><strong style={{fontFamily:MONO}}>{fC(totalCad)}</strong></div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",fontFamily:F}}><span style={{color:"#374151"}}>Work fees accrued</span><strong style={{color:"#065f46",fontFamily:MONO}}>{fC(totalCad*CLOSING_FEE)}</strong></div>
                  </div>}
                </div>
              )}
              <div style={{marginTop:20}}>
                <label style={lbl}>Transaction co-investors</label>
                <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:8}}>
                  {(form.transactionCoInvestors||[]).map((c,i)=>(
                    <span key={i} style={{background:"#f3f4f6",borderRadius:20,padding:"3px 9px",fontSize:"12px",color:"#374151",fontWeight:500,display:"flex",alignItems:"center",gap:5,fontFamily:F}}>
                      {c}<button onClick={()=>{ const u=form.transactionCoInvestors.filter((_,idx)=>idx!==i); const updated={...form,transactionCoInvestors:u}; setForm(updated); if(isCompleted)onSave({...updated,threadNotes:notes},false); }} style={{background:"none",border:"none",cursor:"pointer",color:"#9ca3af",fontSize:13,padding:0,lineHeight:1}}>×</button>
                    </span>
                  ))}
                </div>
                <div style={{display:"flex",gap:7}}>
                  <input style={inp({flex:1})} value={newCoInv} onChange={e=>setNewCoInv(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"&&newCoInv.trim()){ const u=[...(form.transactionCoInvestors||[]),newCoInv.trim()]; const updated={...form,transactionCoInvestors:u}; setForm(updated); if(isCompleted)onSave({...updated,threadNotes:notes},false); setNewCoInv(""); } }} placeholder="Add co-investor..."/>
                  <button onClick={()=>{ if(!newCoInv.trim())return; const u=[...(form.transactionCoInvestors||[]),newCoInv.trim()]; const updated={...form,transactionCoInvestors:u}; setForm(updated); if(isCompleted)onSave({...updated,threadNotes:notes},false); setNewCoInv(""); }} style={btn("ghost",{padding:"7px 10px",flexShrink:0})}>Add</button>
                </div>
              </div>
            </div>
          )}

          {tab==="notes"&&(
            <div>
              <div style={{marginBottom:12,padding:"9px 12px",background:"#f9f9f7",borderRadius:8,display:"flex",alignItems:"center",gap:9}}>
                <span style={{fontSize:"10px",fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:"0.06em",whiteSpace:"nowrap",fontFamily:F}}>Your name</span>
                <input style={inp({background:"#fff",padding:"5px 9px",fontSize:"12px"})} value={author} onChange={e=>{ setAuthor(e.target.value); try{localStorage.setItem("itmv-author",e.target.value);}catch(err){} }}/>
              </div>
              {notes.length===0&&<div style={{textAlign:"center",padding:28,color:"#9ca3af",fontSize:"13px",fontFamily:F}}>No notes yet.</div>}
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
                {notes.map(n=>(
                  <NoteRow key={n.id} n={n}
                    onSaveEdit={(id,text)=>{ const u=notes.map(x=>x.id===id?{...x,text}:x); setNotes(u); onSave({...form,threadNotes:u},false); }}
                    onDelete={()=>{ const u=notes.filter(x=>x.id!==n.id); setNotes(u); onSave({...form,threadNotes:u},false); }}
                  />
                ))}
                <div ref={notesEnd}/>
              </div>
              <div style={{borderTop:"1px solid #f0f0f0",paddingTop:12}}>
                <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center",flexWrap:"wrap"}}>
                  <select style={inp({width:110})} value={newNoteTag} onChange={e=>setNewNoteTag(e.target.value)}>{NOTE_TAGS.map(t=><option key={t}>{t}</option>)}</select>
                  <label style={{display:"flex",alignItems:"center",gap:6,fontSize:"12px",color:"#6b7280",cursor:"pointer",fontFamily:F,whiteSpace:"nowrap"}}>
                    <input type="checkbox" checked={noteDateEnabled} onChange={e=>{ setNoteDateEnabled(e.target.checked); if(!e.target.checked)setNoteDate(""); }} style={{cursor:"pointer"}}/>Add date
                  </label>
                  {noteDateEnabled&&<input style={inp({width:160})} type="date" value={noteDate} onChange={e=>setNoteDate(e.target.value)}/>}
                </div>
                <textarea style={inp({height:68,resize:"none",marginBottom:8})} value={newNote} onChange={e=>setNewNote(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))addNote(); }} placeholder="Add a note… (Cmd+Enter)"/>
                <button onClick={addNote} disabled={!newNote.trim()} style={btn("primary",{opacity:newNote.trim()?1:0.4})}>Add note</button>
              </div>
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{padding:"12px 28px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"1px solid #f0f0f0",flexShrink:0}}>
          <div>{form.id&&<button onClick={()=>onDelete(form.id)} style={btn("danger")}>Delete</button>}</div>
          <div style={{display:"flex",gap:8}}>
            {form.id&&!isCompleted&&form.stage!=="Passed"&&(
              <>
                <button onClick={()=>onPass(form.id,form.stage)} style={btn("ghost")}>Mark passed</button>
                <button onClick={()=>onComplete({...form,threadNotes:notes})} style={btn("green")}>Mark completed</button>
              </>
            )}
            <button onClick={onClose} style={btn("ghost")}>{isCompleted?"Close":"Cancel"}</button>
            {!isCompleted&&<button onClick={handleSave} style={btn("primary")}>{form.id?"Save":"Add deal"}</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Investments Page ──────────────────────────────────────────────────────────
function InvestmentsPage({deals,setDeals,save,settings,invProfiles,setInvProfiles,scenarios,onSaveScenarios}){
  const [modal,setModal]=useState(null);
  const [completionDeal,setCompletionDeal]=useState(null);
  const [showPassed,setShowPassed]=useState(false);
  const [filterStage,setFilterStage]=useState("All");

  const completed=deals.filter(d=>d.stage==="Completed");
  const passed=deals.filter(d=>d.stage==="Passed");
  const active=deals.filter(d=>ACTIVE_STAGES.includes(d.stage));
  const deployedCad=completed.reduce((s,d)=>s+((d.completionData&&d.completionData.totalCad)||0),0);
  const committedCad=active.reduce((s,d)=>s+d.investors.reduce((ss,i)=>ss+toCad(i.amount,i.currency,settings),0),0);
  const visible=active.filter(d=>filterStage==="All"||d.stage===filterStage);

  function saveDeal(form,close=true){
    if(form.id){
      const u=deals.map(x=>x.id===form.id?form:x); setDeals(u); save(u);
    } else {
      const newDeal={...form,id:uid(),threadNotes:form.threadNotes||[],investors:form.investors||[],transactionCoInvestors:form.transactionCoInvestors||[],passedFromStage:""};
      const u=[...deals,newDeal]; setDeals(u); save(u);
    }
    if(close) setModal(null);
  }
  function delDeal(id){ const u=deals.filter(x=>x.id!==id); setDeals(u); save(u); setModal(null); }
  function passDeal(id,fromStage){ const u=deals.map(x=>x.id===id?{...x,stage:"Passed",passedFromStage:fromStage||x.stage}:x); setDeals(u); save(u); setModal(null); }

  const completeDeal=useCallback(data=>{
    setCompletionDeal(prev=>{
      if(!prev) return null;
      const u=deals.map(x=>x.id===prev.id?{...x,stage:"Completed",completionData:data}:x);
      setDeals(u); save(u); setModal(null); return null;
    });
  },[deals,save]);

  const empty={id:null,name:"",stage:"Sourcing",companyStage:"Seed",sector:"SaaS",website:"",investors:[],transactionCoInvestors:[],managementMeeting:"No",meetingDate:"",itmvReferral:"",itmvReferralOther:"",externalReferral:"",externalReferralEmail:"",relationshipSource:"",threadNotes:[],completionData:null,contactName:"",contactRole:"Founder",investType:"SAFE",investTypeOther:"",hq:"Canada",hqOther:"",passedFromStage:"",isBridge:false};

  function renderCard(d,onClick,style){
    const totalCad=d.investors.reduce((s,i)=>s+toCad(i.amount,i.currency,settings),0);
    const investType=d.investType&&d.investType!=="Other"?d.investType:(d.investTypeOther||null);
    const stageVal=d.companyStage?(d.isBridge?d.companyStage+" (Bridge)":d.companyStage):null;
    const rows=[{label:"Stage:",value:stageVal},{label:"Type:",value:investType},{label:"Proposed $:",value:totalCad>0?fC(totalCad):null}].filter(r=>r.value);
    return(
      <div key={d.id} onClick={onClick} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,padding:"10px 12px",cursor:"pointer",marginBottom:7,...(style||{})}}
        onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 14px rgba(0,0,0,0.08)";e.currentTarget.style.transform="translateY(-1px)";}}
        onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";e.currentTarget.style.transform="none";}}>
        <div style={{fontWeight:700,fontSize:"12px",color:"#111",marginBottom:rows.length?6:0,fontFamily:F}}>{d.name}</div>
        <div style={{display:"flex",flexDirection:"column",gap:3}}>
          {rows.length===0?<span style={{fontSize:"10px",color:"#d1d5db",fontFamily:F}}>No details yet</span>:rows.map(r=>(
            <div key={r.label} style={{display:"grid",gridTemplateColumns:"80px 1fr",columnGap:4,alignItems:"baseline"}}>
              <span style={{fontSize:"9px",fontWeight:600,color:"#9ca3af",fontFamily:F,whiteSpace:"nowrap"}}>{r.label}</span>
              <span style={{fontSize:"10px",fontWeight:500,color:"#374151",fontFamily:r.label==="Proposed $:"?MONO:F,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.value}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return(
    <div style={{flex:1,overflowY:"auto",padding:"36px 40px",background:"#f9f9f7",boxSizing:"border-box"}}>
      {completionDeal&&<CompletionModal deal={completionDeal} onConfirm={completeDeal} onCancel={()=>setCompletionDeal(null)} settings={settings}/>}
      {modal&&<DealModal deal={modal} onSave={saveDeal} onClose={()=>setModal(null)} onDelete={delDeal} onPass={passDeal} onComplete={d=>{setModal(null);setCompletionDeal(d);}} settings={settings} invProfiles={invProfiles} setInvProfiles={setInvProfiles} deals={deals} scenarios={scenarios[modal.id]||[]} onSaveScenarios={onSaveScenarios}/>}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:26}}>
        <h1 style={{margin:0,fontSize:"20px",fontWeight:700,color:"#111",fontFamily:F}}>Investments</h1>
        <button onClick={()=>setModal({...empty})} style={btn("primary")}>+ New deal</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:12,marginBottom:24}}>
        <StatCard label="Sourcing" value={deals.filter(d=>d.stage==="Sourcing").length}/>
        <StatCard label="Diligence" value={deals.filter(d=>d.stage==="Diligence").length}/>
        <StatCard label="Closing" value={deals.filter(d=>d.stage==="Closing Process").length}/>
        <StatCard label="Completed" value={completed.length}/>
        <StatCard label="Capital deployed" value={deployedCad>0?fC(deployedCad):"C$0"} highlight/>
        <StatCard label="Pipeline committed" value={committedCad>0?fC(committedCad):"C$0"}/>
      </div>

      {/* Closed deals banner */}
      <div style={{background:"linear-gradient(135deg,#166534 0%,#16a34a 100%)",borderRadius:14,padding:"22px 24px",marginBottom:28}}>
        <div style={{marginBottom:completed.length>0?16:0}}>
          <div style={{fontSize:"11px",fontWeight:700,color:"rgba(255,255,255,0.6)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4,fontFamily:F}}>Closed Deals</div>
          <div style={{display:"flex",gap:20,alignItems:"baseline"}}>
            <div><span style={{fontSize:"24px",fontWeight:700,color:"#fff",fontFamily:MONO}}>{completed.length}</span><span style={{fontSize:"12px",color:"rgba(255,255,255,0.6)",marginLeft:6,fontFamily:F}}>{completed.length===1?"deal":"deals"}</span></div>
            <div><span style={{fontSize:"24px",fontWeight:700,color:"#6ee7b7",fontFamily:MONO}}>{fC(deployedCad)}</span><span style={{fontSize:"12px",color:"rgba(255,255,255,0.6)",marginLeft:6,fontFamily:F}}>deployed</span></div>
          </div>
        </div>
        {completed.length===0
          ?<div style={{marginTop:14,padding:16,background:"rgba(255,255,255,0.07)",borderRadius:10,border:"1px dashed rgba(255,255,255,0.2)",textAlign:"center"}}><span style={{fontSize:"12px",color:"rgba(255,255,255,0.4)",fontFamily:F}}>No closed deals yet</span></div>
          :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:8}}>
            {completed.map(d=>renderCard(d,()=>setModal(d),{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)"}))}
          </div>}
      </div>

      {/* Pipeline */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h2 style={{margin:0,fontSize:"14px",fontWeight:700,color:"#111",fontFamily:F}}>Pipeline</h2>
        <div style={{display:"flex",gap:6}}>
          {["All",...ACTIVE_STAGES].map(s=>(
            <button key={s} onClick={()=>setFilterStage(s)} style={{padding:"3px 10px",borderRadius:20,border:filterStage===s?"1.5px solid #111":"1.5px solid #e5e7eb",background:filterStage===s?"#111":"#fff",color:filterStage===s?"#fff":"#374151",fontSize:"11px",fontWeight:600,cursor:"pointer",fontFamily:F}}>{s}</button>
          ))}
        </div>
      </div>

      {visible.length===0&&<div style={{textAlign:"center",padding:40,color:"#9ca3af",fontSize:"13px",fontFamily:F,background:"#fff",borderRadius:12,border:"1px dashed #e5e7eb"}}>No deals in this stage. <button onClick={()=>setModal({...empty})} style={{background:"none",border:"none",color:"#2563eb",cursor:"pointer",fontSize:"13px",fontFamily:F,textDecoration:"underline"}}>Add one →</button></div>}

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
        {ACTIVE_STAGES.filter(s=>filterStage==="All"||filterStage===s).map(stage=>{
          const stageDeal=visible.filter(d=>d.stage===stage);
          return(
            <div key={stage}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <StageBadge stage={stage}/>
                <span style={{fontSize:"11px",color:"#9ca3af",fontFamily:F}}>{stageDeal.length}</span>
              </div>
              {stageDeal.map(d=>renderCard(d,()=>setModal(d)))}
            </div>
          );
        })}
      </div>

      {/* Passed deals */}
      {passed.length>0&&(
        <div style={{marginTop:28}}>
          <button onClick={()=>setShowPassed(p=>!p)} style={{background:"none",border:"none",cursor:"pointer",fontSize:"12px",color:"#9ca3af",fontFamily:F,padding:0,marginBottom:10}}>
            {showPassed?"▾":"▸"} Passed deals ({passed.length})
          </button>
          {showPassed&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:8}}>{passed.map(d=>renderCard(d,()=>setModal(d),{opacity:0.7}))}</div>}
        </div>
      )}
    </div>
  );
}

// ── Investors Page ────────────────────────────────────────────────────────────
function InvestorsPage({investors,setInvestors,saveInvestors,settings}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({id:null,name:"",email:"",phone:"",entity:"",commitmentCad:"",currency:"CAD",onboardingStage:"",notes:""});

  function openNew(){ setForm({id:null,name:"",email:"",phone:"",entity:"",commitmentCad:"",currency:"CAD",onboardingStage:"",notes:""}); setModal("edit"); }
  function openEdit(inv){ setForm({...inv}); setModal("edit"); }
  function save(){
    if(!form.name.trim()) return;
    let u;
    if(form.id){ u=investors.map(x=>x.id===form.id?form:x); }
    else { u=[...investors,{...form,id:uid()}]; }
    setInvestors(u); saveInvestors(u); setModal(null);
  }
  function del(id){ const u=investors.filter(x=>x.id!==id); setInvestors(u); saveInvestors(u); setModal(null); }

  const totalCommitted=investors.reduce((s,i)=>s+toCad(i.commitmentCad,i.currency,settings),0);

  return(
    <div style={{flex:1,overflowY:"auto",padding:"36px 40px",background:"#f9f9f7"}}>
      {modal==="edit"&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
          <div style={{background:"#fff",borderRadius:14,padding:"28px 30px",width:"100%",maxWidth:480,fontFamily:F,boxShadow:"0 24px 64px rgba(0,0,0,0.15)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <span style={{fontSize:"16px",fontWeight:700,color:"#111",fontFamily:F}}>{form.id?"Edit investor":"Add investor"}</span>
              <button onClick={()=>setModal(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#9ca3af"}}>×</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div><label style={lbl}>Name *</label><input style={inp()} value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Full name"/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div><label style={lbl}>Email</label><input style={inp()} type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/></div>
                <div><label style={lbl}>Phone</label><input style={inp()} value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))}/></div>
              </div>
              <div><label style={lbl}>Entity / fund</label><input style={inp()} value={form.entity} onChange={e=>setForm(f=>({...f,entity:e.target.value}))}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 80px",gap:8}}>
                <div><label style={lbl}>Commitment amount</label><input style={inp()} type="number" value={form.commitmentCad} onChange={e=>setForm(f=>({...f,commitmentCad:e.target.value}))}/></div>
                <div><label style={lbl}>Currency</label><select style={inp()} value={form.currency} onChange={e=>setForm(f=>({...f,currency:e.target.value}))}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select></div>
              </div>
              <div><label style={lbl}>Notes</label><textarea style={inp({height:60,resize:"none"})} value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:20}}>
              <div>{form.id&&<button onClick={()=>del(form.id)} style={btn("danger")}>Delete</button>}</div>
              <div style={{display:"flex",gap:8}}><button onClick={()=>setModal(null)} style={btn("ghost")}>Cancel</button><button onClick={save} style={btn("primary")}>Save</button></div>
            </div>
          </div>
        </div>
      )}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:26}}>
        <h1 style={{margin:0,fontSize:"20px",fontWeight:700,color:"#111",fontFamily:F}}>Investors</h1>
        <button onClick={openNew} style={btn("primary")}>+ Add investor</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}}>
        <StatCard label="Total LPs" value={investors.length}/>
        <StatCard label="Total commitments" value={fC(totalCommitted)} highlight/>
      </div>

      {investors.length===0
        ?<div style={{textAlign:"center",padding:48,color:"#9ca3af",fontSize:"13px",fontFamily:F,background:"#fff",borderRadius:12,border:"1px dashed #e5e7eb"}}>No investors yet. Add your first LP.</div>
        :<div style={{display:"flex",flexDirection:"column",gap:8}}>
          {investors.map(inv=>{
            const cad=toCad(inv.commitmentCad,inv.currency,settings);
            return(
              <div key={inv.id} onClick={()=>openEdit(inv)} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,padding:"14px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}
                onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.06)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
                <div>
                  <div style={{fontSize:"13px",fontWeight:700,color:"#111",marginBottom:2,fontFamily:F}}>{inv.name}</div>
                  <div style={{fontSize:"11px",color:"#6b7280",fontFamily:F}}>{[inv.entity,inv.email].filter(Boolean).join(" · ")}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  {cad>0&&<div style={{fontSize:"13px",fontWeight:700,color:"#111",fontFamily:MONO}}>{fC(cad)}</div>}
                </div>
              </div>
            );
          })}
        </div>}
    </div>
  );
}

// ── Performance Page ──────────────────────────────────────────────────────────
function PerformancePage({deals,settings}){
  const completed=deals.filter(d=>d.stage==="Completed"&&d.completionData);
  const totalDeployed=completed.reduce((s,d)=>s+(d.completionData.totalCad||0),0);
  const totalFees=completed.reduce((s,d)=>s+(d.completionData.totalCad||0)*CLOSING_FEE,0);
  const hp=settings.hurdlePct||5; const cp=settings.carryPct||20;
  return(
    <div style={{flex:1,overflowY:"auto",padding:"36px 40px",background:"#f9f9f7"}}>
      <h1 style={{margin:"0 0 24px",fontSize:"20px",fontWeight:700,color:"#111",fontFamily:F}}>Performance</h1>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:28}}>
        <StatCard label="Completed deals" value={completed.length}/>
        <StatCard label="Total deployed" value={fC(totalDeployed)} highlight/>
        <StatCard label="Work fees accrued" value={fC(totalFees)}/>
        <StatCard label="Hurdle rate" value={`${hp}% p.a.`}/>
      </div>
      {completed.length===0
        ?<div style={{textAlign:"center",padding:48,color:"#9ca3af",fontSize:"13px",fontFamily:F,background:"#fff",borderRadius:12,border:"1px dashed #e5e7eb"}}>No completed deals yet.</div>
        :<div style={{display:"flex",flexDirection:"column",gap:10}}>
          {completed.map(d=>{
            const cd=d.completionData;
            return(
              <div key={d.id} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:12,padding:"16px 18px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div style={{fontSize:"14px",fontWeight:700,color:"#111",fontFamily:F}}>{d.name}</div>
                  <div style={{fontSize:"11px",color:"#6b7280",fontFamily:F}}>{cd.closeDate?`Closed ${fDate(cd.closeDate)}`:""}</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}}>
                  {[{l:"Capital in",v:fC(cd.totalCad)},{l:"Post-money",v:cd.postMoney?fC(cd.postMoney):"—"},{l:"Ownership",v:cd.ownership?fPct(cd.ownership):"—"},{l:"Work fee",v:fC((cd.totalCad||0)*CLOSING_FEE),c:"#065f46"},{l:"Hurdle",v:fC((cd.totalCad||0)*(hp/100))}].map(f=>(
                    <div key={f.l} style={{background:"#f9f9f7",borderRadius:8,padding:"8px 10px"}}>
                      <div style={{fontSize:"9px",fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:3,fontFamily:F}}>{f.l}</div>
                      <div style={{fontSize:"13px",fontWeight:600,color:f.c||"#111",fontFamily:MONO}}>{f.v}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>}
    </div>
  );
}

// ── Network Page ──────────────────────────────────────────────────────────────
function NetworkPage({deals,netNotes,setNetNotes,saveNetNotes}){
  const [newNote,setNewNote]=useState("");
  const [author,setAuthor]=useState(()=>{ try{return localStorage.getItem("itmv-author")||"";}catch(e){return "";} });

  function addNote(){
    if(!newNote.trim()) return;
    const n={id:uid(),text:newNote.trim(),author:author||"Anonymous",timestamp:new Date().toISOString()};
    const u=[...netNotes,n]; setNetNotes(u); saveNetNotes(u); setNewNote("");
  }

  // Build referral network from deals
  const referrals={};
  deals.forEach(d=>{
    if(d.externalReferral){ if(!referrals[d.externalReferral])referrals[d.externalReferral]=[]; referrals[d.externalReferral].push(d.name); }
  });

  return(
    <div style={{flex:1,overflowY:"auto",padding:"36px 40px",background:"#f9f9f7"}}>
      <h1 style={{margin:"0 0 24px",fontSize:"20px",fontWeight:700,color:"#111",fontFamily:F}}>Network</h1>
      {Object.keys(referrals).length>0&&(
        <div style={{marginBottom:24}}>
          <div style={{fontSize:"10px",fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10,fontFamily:F}}>Referral sources</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {Object.entries(referrals).map(([name,dls])=>(
              <div key={name} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:"13px",fontWeight:600,color:"#111",fontFamily:F}}>{name}</span>
                <span style={{fontSize:"11px",color:"#6b7280",fontFamily:F}}>{dls.join(", ")}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      <div style={{fontSize:"10px",fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10,fontFamily:F}}>Network notes</div>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
        {netNotes.map(n=>(
          <div key={n.id} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:9,padding:"10px 12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <span style={{fontSize:"12px",fontWeight:700,color:"#111",fontFamily:F}}>{n.author}</span>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:"10px",color:"#9ca3af",fontFamily:F}}>{fDate(n.timestamp)}</span>
                <button onClick={()=>{ const u=netNotes.filter(x=>x.id!==n.id); setNetNotes(u); saveNetNotes(u); }} style={{background:"none",border:"none",cursor:"pointer",color:"#d1d5db",fontSize:13,padding:0}}>×</button>
              </div>
            </div>
            <p style={{margin:0,fontSize:"13px",color:"#374151",lineHeight:1.6,fontFamily:F}}>{n.text}</p>
          </div>
        ))}
      </div>
      <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,padding:"12px 14px"}}>
        <div style={{marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:"10px",fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:"0.06em",fontFamily:F}}>Your name</span>
          <input style={inp({background:"#f9f9f7",padding:"4px 9px",fontSize:"12px"})} value={author} onChange={e=>{ setAuthor(e.target.value); try{localStorage.setItem("itmv-author",e.target.value);}catch(err){} }}/>
        </div>
        <textarea style={inp({height:60,resize:"none",marginBottom:8})} value={newNote} onChange={e=>setNewNote(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))addNote(); }} placeholder="Add a network note… (Cmd+Enter)"/>
        <button onClick={addNote} disabled={!newNote.trim()} style={btn("primary",{opacity:newNote.trim()?1:0.4})}>Add note</button>
      </div>
    </div>
  );
}

// ── Data Room Page ────────────────────────────────────────────────────────────
function DataRoomPage(){
  return(
    <div style={{flex:1,overflowY:"auto",padding:"36px 40px",background:"#f9f9f7"}}>
      <h1 style={{margin:"0 0 8px",fontSize:"20px",fontWeight:700,color:"#111",fontFamily:F}}>Data Room</h1>
      <p style={{fontSize:"13px",color:"#6b7280",fontFamily:F,marginBottom:24}}>Deal-specific documents are available inside each completed deal's detail view.</p>
      <div style={{background:"#fff",border:"1px dashed #e5e7eb",borderRadius:12,padding:40,textAlign:"center"}}>
        <div style={{fontSize:"13px",color:"#9ca3af",fontFamily:F}}>Open a completed deal → Details tab → Data Room section to upload and manage documents.</div>
      </div>
    </div>
  );
}

// ── Settings Page ─────────────────────────────────────────────────────────────
function SettingsPage({settings,onSave}){
  const [form,setForm]=useState({...settings});
  const [saved,setSaved]=useState(false);
  function save(){ onSave(form); setSaved(true); setTimeout(()=>setSaved(false),2000); }
  return(
    <div style={{flex:1,overflowY:"auto",padding:"36px 40px",background:"#f9f9f7"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
        <h1 style={{margin:0,fontSize:"20px",fontWeight:700,color:"#111",fontFamily:F}}>Settings</h1>
        {saved&&<span style={{fontSize:"12px",color:"#065f46",fontWeight:600,fontFamily:F}}>✓ Saved</span>}
      </div>
      <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:12,padding:"22px 24px",maxWidth:480}}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><label style={lbl}>USD → CAD rate</label><input style={inp()} type="number" step="0.01" value={form.usdCad} onChange={e=>setForm(f=>({...f,usdCad:Number(e.target.value)}))}/></div>
          <div><label style={lbl}>Default currency</label><select style={inp()} value={form.defaultCurrency} onChange={e=>setForm(f=>({...f,defaultCurrency:e.target.value}))}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select></div>
          <div><label style={lbl}>Closing fee %</label><input style={inp()} type="number" step="0.1" value={form.closingFeePct} onChange={e=>setForm(f=>({...f,closingFeePct:Number(e.target.value)}))}/></div>
          <div><label style={lbl}>Hurdle rate % (p.a.)</label><input style={inp()} type="number" step="0.1" value={form.hurdlePct} onChange={e=>setForm(f=>({...f,hurdlePct:Number(e.target.value)}))}/></div>
          <div><label style={lbl}>Carry %</label><input style={inp()} type="number" step="0.1" value={form.carryPct} onChange={e=>setForm(f=>({...f,carryPct:Number(e.target.value)}))}/></div>
          <button onClick={save} style={btn("primary",{alignSelf:"flex-start",padding:"9px 20px"})}>Save settings</button>
        </div>
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("investments");
  const [deals,setDeals]=useState([]);
  const [investors,setInvestors]=useState([]);
  const [settings,setSettings]=useState(DEFAULT_SETTINGS);
  const [invProfiles,setInvProfiles]=useState({});
  const [scenarios,setScenarios]=useState({});
  const [netNotes,setNetNotes]=useState([]);
  const [loading,setLoading]=useState(true);
  const [dbReady,setDbReady]=useState(true);

  // Check if Supabase credentials are configured
  const isConfigured = SUPABASE_URL !== "YOUR_SUPABASE_URL_HERE" && SUPABASE_KEY !== "YOUR_SUPABASE_ANON_KEY_HERE";

  // ── Load all data on mount ──
  useEffect(()=>{
    if(!isConfigured){ setDeals(INIT_DEALS); setLoading(false); return; }
    async function loadAll(){
      try{
        const [dealsRes, invRes, setRes, profRes, scnRes, netRes] = await Promise.all([
          sbGet('app_data','deals'),
          sbGet('app_data','investors'),
          sbGet('app_data','settings'),
          sbGet('app_data','inv_profiles'),
          sbGet('app_data','scenarios'),
          sbGet('app_data','net_notes'),
        ]);
        setDeals(dealsRes || INIT_DEALS);
        setInvestors(invRes || []);
        if(setRes) setSettings(setRes);
        setInvProfiles(profRes || {});
        setScenarios(scnRes || {});
        setNetNotes(netRes || []);
      } catch(e){
        console.error("Load error:",e);
        setDeals(INIT_DEALS);
      }
      setLoading(false);
    }
    loadAll();
  },[]);

  // ── Real-time sync ──
  useEffect(()=>{
    if(!isConfigured) return;
    const channel = db.channel('app-sync')
      .on('postgres_changes',{event:'*',schema:'public',table:'app_data',filter:"key=eq.deals"},
        ({new:row})=>{ if(row&&row.value) setDeals(row.value); })
      .on('postgres_changes',{event:'*',schema:'public',table:'app_data',filter:"key=eq.investors"},
        ({new:row})=>{ if(row&&row.value) setInvestors(row.value); })
      .on('postgres_changes',{event:'*',schema:'public',table:'app_data',filter:"key=eq.settings"},
        ({new:row})=>{ if(row&&row.value) setSettings(row.value); })
      .subscribe();
    return ()=>db.removeChannel(channel);
  },[isConfigured]);

  // ── Save helpers ──
  const saveDeals    = useCallback(d  => sbSet('app_data','deals',d),[]);
  const saveInvestors= useCallback(i  => sbSet('app_data','investors',i),[]);
  const saveSettings = useCallback(s  => sbSet('app_data','settings',s),[]);
  const saveProfiles = useCallback(p  => sbSet('app_data','inv_profiles',p),[]);
  const saveNetNotes = useCallback(n  => sbSet('app_data','net_notes',n),[]);

  const wrappedSetProfiles = useCallback((updater)=>{
    setInvProfiles(prev=>{
      const next = typeof updater==="function" ? updater(prev) : updater;
      saveProfiles(next);
      return next;
    });
  },[saveProfiles]);

  function onSaveScenarios(dealId,s){
    setScenarios(prev=>{ const next={...prev,[dealId]:s}; sbSet('app_data','scenarios',next); return next; });
  }
  function onSaveSettings(s){ setSettings(s); saveSettings(s); }

  if(loading){
    return(
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#f9f9f7",flexDirection:"column",gap:12}}>
        <div style={{width:32,height:32,border:"3px solid #e5e7eb",borderTop:"3px solid #111",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
        <span style={{fontSize:"13px",color:"#6b7280",fontFamily:F}}>Loading ITMV CRM…</span>
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    );
  }

  return(
    <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
      {/* Setup banner when unconfigured */}
      {!isConfigured&&(
        <div style={{position:"fixed",top:0,left:0,right:0,background:"#fef3c7",borderBottom:"1px solid #fbbf24",padding:"10px 20px",zIndex:999,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:"12px",fontWeight:700,color:"#92400e",fontFamily:F}}>⚠ Demo mode — </span>
          <span style={{fontSize:"12px",color:"#92400e",fontFamily:F}}>Open this file in a text editor and replace <code style={{background:"#fde68a",padding:"1px 4px",borderRadius:3}}>YOUR_SUPABASE_URL_HERE</code> and <code style={{background:"#fde68a",padding:"1px 4px",borderRadius:3}}>YOUR_SUPABASE_ANON_KEY_HERE</code> at the top with your Supabase credentials to enable shared real-time data.</span>
        </div>
      )}

      <Sidebar active={tab} onTab={setTab}/>

      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",marginTop:isConfigured?0:44}}>
        {tab==="investments"&&<InvestmentsPage deals={deals} setDeals={setDeals} save={saveDeals} settings={settings} invProfiles={invProfiles} setInvProfiles={wrappedSetProfiles} scenarios={scenarios} onSaveScenarios={onSaveScenarios}/>}
        {tab==="investors"&&<InvestorsPage investors={investors} setInvestors={setInvestors} saveInvestors={saveInvestors} settings={settings}/>}
        {tab==="performance"&&<PerformancePage deals={deals} settings={settings}/>}
        {tab==="network"&&<NetworkPage deals={deals} netNotes={netNotes} setNetNotes={setNetNotes} saveNetNotes={saveNetNotes}/>}
        {tab==="dataroom"&&<DataRoomPage/>}
        {tab==="settings"&&<SettingsPage settings={settings} onSave={onSaveSettings}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

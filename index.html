function calcCarry(proceeds,capitalIn,closeDate,hp,cp){
  var wf=capitalIn*CLOSING_FEE, yrs=1;
  if(closeDate){ yrs=Math.max((Date.now()-new Date(closeDate).getTime())/(365.25*24*3600*1000),1); }
  var hurdle=capitalIn*(hp/100)*yrs;
  if(proceeds<=capitalIn) return {workFee:0,workFeePayable:false,carryAmt:0,lpNet:proceeds,aboveHurdle:false,hurdle:hurdle,yrs:yrs,totalItmvRev:0};
  var afterCap=proceeds-capitalIn;
  if(afterCap<wf) return {workFee:afterCap,workFeePayable:true,carryAmt:0,lpNet:capitalIn,aboveHurdle:false,hurdle:hurdle,yrs:yrs,totalItmvRev:afterCap};
  var afterWF=afterCap-wf;
  if(afterWF<=hurdle) return {workFee:wf,workFeePayable:true,carryAmt:0,lpNet:proceeds-wf,aboveHurdle:false,hurdle:hurdle,yrs:yrs,totalItmvRev:wf};
  var stepD=hurdle*(cp/100), rem=afterWF-hurdle-stepD, carryE=rem>0?rem*(cp/100):0, carryAmt=stepD+carryE;
  return {workFee:wf,workFeePayable:true,carryAmt:carryAmt,lpNet:proceeds-wf-carryAmt,aboveHurdle:true,hurdle:hurdle,yrs:yrs,totalItmvRev:wf+carryAmt};
}

function App(){

  var scns=useState({}); var scenarios=scns[0],setScenarios=scns[1];
  var ls=useState(true); var loading=ls[0],setLoading=ls[1];

  useEffect(function(){
    if(!isConfigured){ setDeals(INIT_DEALS); setLoading(false); return; }
    Promise.all([sbGet("deals"),sbGet("settings"),sbGet("inv_profiles"),sbGet("scenarios")]).then(function(results){
      setDeals(results[0]||INIT_DEALS);
      if(results[1]) setSettings(results[1]);
      setInvProfiles(results[2]||{});
      setScenarios(results[3]||{});
      setLoading(false);
    });
  },[]);

  useEffect(function(){
    if(!isConfigured) return;
    var channel=db.channel("app-sync")
      .on("postgres_changes",{event:"*",schema:"public",table:"app_data",filter:"key=eq.deals"},function(payload){ if(payload.new&&payload.new.value) setDeals(payload.new.value); })
      .on("postgres_changes",{event:"*",schema:"public",table:"app_data",filter:"key=eq.settings"},function(payload){ if(payload.new&&payload.new.value) setSettings(payload.new.value); })
      .subscribe();
    return function(){ db.removeChannel(channel); };
  },[]);

  var saveDeals=useCallback(function(d){ sbSet("deals",d); },[]);
  var saveSettings=useCallback(function(s){ sbSet("settings",s); },[]);
  function onSaveScenarios(dealId,s){ setScenarios(function(prev){ var next=Object.assign({},prev,{[dealId]:s}); sbSet("scenarios",next); return next; }); }
